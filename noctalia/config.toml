config_version = 20

[audio]
enable_notification_sounds = false
enable_screenshot_sounds = false

[bar.default]
capsule_radius = 0
center = [ "workspaces" ]
end = [ "network", "bluetooth", "volume", "brightness", "battery", "clock", "tray", "notifications", "session" ]
margin_ends = 0
radius = 0
start = [
    "control-center",
    "launcher",
    "wallpaper",
    "clipboard",
    "audio_visualizer",
    "media",
    "cpu",
    "ram",
    "network_rx",
    "network_tx"
]
thickness = 24

[idle]
behavior_order = [ "screen-off", "Keyboard Reset", "idle-behavior", "lock-and-suspend" ]

    [idle.behavior."Keyboard Reset"]
    action = "command"
    command = "hyprctl switchxkblayout all 0"
    enabled = true
    timeout = 300.0

    [idle.behavior.idle-behavior]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 280.0

[lockscreen]
edge_smoothness = 0.29999999329447746
grace_period_seconds = 5
transition_duration = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box"]
    box_height = 150.0
    box_width = 810.0
    cx = 960.0
    cy = 894.0
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = false
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
keyboard_layout = false

[shell]
corner_radius_scale = 0.0
polkit_agent = true
screen_time_enabled = true

    [shell.launcher]
    compact = true
    show_app_actions = true

    [shell.screen_corners]
    size = 1

[theme]
builtin = "Eldritch"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "ghostty" ]

[wallpaper]
directory = "/home/wertual/.config/hypr"

    [wallpaper.default]
    path = "/home/wertual/.config/hypr/bg0.jpg"

    [wallpaper.last]
    path = "/home/wertual/.config/hypr/bg0.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/wertual/.config/hypr/bg0.jpg"

[widget.clock]
format = "{:%Y-%m-%d %H:%M:%S}"
